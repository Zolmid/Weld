name: Weld platform candidates
run-name: Weld candidates · ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weld-candidates
  cancel-in-progress: false

jobs:
  source:
    if: github.repository == 'Zolmid/Weld' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/checks.yml

  build:
    needs: source
    name: Build and test ${{ matrix.platform }}
    timeout-minutes: 2700
    environment: weld-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux, runner: weld-linux-x64}
          - {platform: win, runner: weld-windows-x64}
          - {platform: mac, runner: weld-macos-arm64}
          - {platform: ios, runner: weld-ios-arm64}
          - {platform: android, runner: weld-linux-x64}
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    defaults:
      run:
        working-directory: src/brave
    env:
      WELD_IOS_SIMULATOR_UDID: ${{ vars.WELD_IOS_SIMULATOR_UDID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: src/brave
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global --no-audit --no-fund pnpm@11.11.0
      - name: Build, test and package
        shell: bash
        run: python3 -B ci/build.py "${{ matrix.platform }}" "$RUNNER_TEMP/weld-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.platform }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: weld-candidate-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/weld-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}/*.zip
            ${{ runner.temp }}/weld-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}/*.apk
            ${{ runner.temp }}/weld-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}/*.tar.gz
            ${{ runner.temp }}/weld-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}/*.json
          if-no-files-found: error
          retention-days: 7

  android-smoke:
    name: Android arm64 emulator
    needs: build
    environment: weld-build
    runs-on: [self-hosted, weld-android-arm64-emulator]
    timeout-minutes: 20
    env:
      WELD_ANDROID_SERIAL: ${{ vars.WELD_ANDROID_SERIAL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: weld-candidate-android
          path: candidate
      - run: python3 -B ci/mobile_smoke.py android candidate/Weld-android-arm64.apk
