name: Weld upstream and security watch

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2,14 * * *'

permissions:
  contents: read

concurrency:
  group: weld-upstream
  cancel-in-progress: false

jobs:
  watch:
    if: github.repository == 'Zolmid/Weld' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - run: |
          python3 -B ci/upstream.py report upstream-report.json
          {
            echo '## Official upstream revisions'
            echo 'Chromium stable version discrepancies require triage against the official security bulletins.'
            echo '```json'
            cat upstream-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: weld-upstream-report
          path: upstream-report.json
          if-no-files-found: error
          retention-days: 14
